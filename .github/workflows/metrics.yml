name: Metrics

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: koki26
          filename: assets/metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Europe/Prague
          config_animations: yes
          extras_css: |
            svg { color: #8B949E; }
            h1, h2, h3 { color: #58A6FF; }
            .count, .date { color: #8B949E; }

      - name: Languages and calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: koki26
          filename: assets/metrics-languages.svg
          base: ""
          config_timezone: Europe/Prague
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_css: |
            svg { color: #8B949E; }
            h1, h2, h3 { color: #58A6FF; }
            .count, .date { color: #8B949E; }
